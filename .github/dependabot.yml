# =============================================================================
# Dependabot Configuration
# =============================================================================
# Automatically creates PRs to keep dependencies up to date.
# Documentation: https://docs.github.com/en/code-security/dependabot
# =============================================================================

version: 2

updates:
  # ===========================================================================
  # Go Modules
  # ===========================================================================
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    
    # Limit open PRs to avoid overwhelming the maintainers
    open-pull-requests-limit: 5

    # gotk4 v0.4+ binds glib 2.82+ symbols (g_get_monotonic_time_ns, ...).
    # GitHub Actions runners (ubuntu-24.04, glib 2.80) cannot compile it, and
    # the resulting binaries refuse to start on any distro with glib < 2.82.
    # Keep gotk4 on v0.3.x — the version gotk4-adwaita itself requires — until
    # the runner image ships glib 2.82+.
    ignore:
      - dependency: "github.com/diamondburned/gotk4/pkg"
        update-types: ["version", "prerelease", "change"]
        versions: ["0.4"]
    
    # Commit message format (conventional commits)
    commit-message:
      prefix: "deps(go)"
      include: "scope"
    
    # Labels for filtering and automation
    labels:
      - "dependencies"
      - "go"
    
    # Assignees for dependency updates
    assignees:
      - "yllada"
    
    # Group updates to reduce PR noise
    groups:
      # Group all patch updates together
      go-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      
      # Group minor updates together
      go-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  # ===========================================================================
  # GitHub Actions
  # ===========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    
    open-pull-requests-limit: 5
    
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    
    assignees:
      - "yllada"
    
    # Group all GitHub Actions updates together
    groups:
      github-actions-all:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
