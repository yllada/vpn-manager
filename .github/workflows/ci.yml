# =============================================================================
# VPN Manager - Continuous Integration
# =============================================================================
# Parallel CI pipeline for Go + GTK4 projects.
#
# Architecture (2026-11 refactor):
#   - Three parallel jobs: lint, test, build
#   - Why? They share only setup, not work: lint no longer waits for the
#     full test suite, build feedback arrives as fast as test feedback,
#     and each job can fail independently without re-running the others.
#   - A single shared setup-go-gtk action installs Go + GTK once per job.
#
# Optimizations:
#   - APT package caching (~60s -> ~5s)
#   - Go module caching (via setup-go)
#   - Go build cache keyed on go.sum only (warm across PRs and branches;
#     the previous key included github.sha, which never matched and left
#     every PR with a cold gotk4 compile)
#   - Race detector only on PRs (10-20x slower)
#   - only-new-issues on PRs (faster feedback)
#
# Documentation: https://docs.github.com/en/actions
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

# Cancel in-progress runs for the same branch and job
concurrency:
  group: ci-${{ github.ref }}-${{ github.job }}
  cancel-in-progress: true

env:
  # Must be compatible with Go version in go.mod (currently 1.26.2)
  # Check releases: https://github.com/golangci/golangci-lint/releases
  GOLANGCI_LINT_VERSION: 'v2.11'

permissions:
  contents: read

jobs:
  # =============================================================================
  # Lint
  # =============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go and GTK
        uses: ./.github/actions/setup-go-gtk

      # golangci-lint compiles the gotk4 closure; this warm-up is what
      # makes the lint step cheap when the build cache is warm.
      - name: Warm up Go build cache
        run: |
          echo "Pre-compiling dependencies (gotk4 CGO bindings)..."
          go build ./...
        env:
          CGO_ENABLED: 1

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: binary
          args: --timeout=15m
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          skip-save-cache: false

  # =============================================================================
  # Test
  # =============================================================================
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go and GTK
        uses: ./.github/actions/setup-go-gtk

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running tests WITH race detector (PR)"
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          else
            echo "Running tests WITHOUT race detector (push)"
            go test -v -coverprofile=coverage.out -covermode=atomic ./...
          fi
        env:
          CGO_ENABLED: 1

      - name: Display coverage summary
        run: |
          echo "Coverage Summary:"
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  # =============================================================================
  # Build
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go and GTK
        uses: ./.github/actions/setup-go-gtk

      - name: Build GUI application
        run: |
          CGO_ENABLED=1 go build -trimpath \
            -ldflags="-s -w \
              -X main.appVersion=ci-${{ github.sha }} \
              -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X main.commitSHA=${{ github.sha }}" \
            -o vpn-manager ./cmd/vpn-manager

      - name: Build daemon
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w" \
            -o vpn-managerd ./cmd/vpn-managerd

      - name: Verify binaries
        run: |
          echo "GUI Application:"
          file vpn-manager

          # --version exits before GTK init, so it works headless and is a
          # real smoke check: a broken CGO binary fails here.
          ./vpn-manager --version || { echo "::error::GUI --version failed (broken binary?)"; exit 1; }

          echo ""
          echo "Daemon:"
          file vpn-managerd
          ./vpn-managerd --version || { echo "::error::Daemon --version failed (broken binary?)"; exit 1; }
